backend:
  name: git-gateway
  repo: tszwkoffie/pages-cms-magic
  branch: jr
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/958e340f-f0d5-405b-89b3-9a51486ce217/pkce
  auth_token_endpoint: /sites/958e340f-f0d5-405b-89b3-9a51486ce217/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
  auth:
    email_claim: email
    first_name_claim: first_name
    last_name_claim: last_name
    avatar_url_claim: avatar_url

# Waar geüploade afbeeldingen terechtkomen in de repo,
# en hoe de site er later naar verwijst.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://tszwkoffie.github.io/pages-cms-magic/
display_url: https://tszwkoffie.github.io/pages-cms-magic/
publish_mode: simple

collections:
  - name: about
    label: Over mij
    files:
      - name: about
        label: Over mij
        file: content/about.md
        fields:
          - { name: name, label: Naam, widget: string }
          - { name: subtitle, label: Sectie-label, widget: string }
          - { name: portrait, label: Portretfoto, widget: image }
          - { name: action, label: Actiefoto, widget: image }
          - { name: age, label: Leeftijd, widget: string }
          - { name: class, label: Klasse, widget: string }
          - { name: nationality, label: Nationaliteit, widget: string }
          - { name: team, label: Team, widget: string }
          - { name: body, label: Korte intro, widget: text }
          - { name: fullStory, label: Volledige verhaal (uitklap), widget: text, required: false }

  - name: races
    label: Seizoen / Racekalender
    label_singular: Race
    folder: content/races
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{round}} — {{track}} ({{date}})"
    sortable_fields: [date, round, track]
    fields:
      - { name: round, label: Ronde, widget: string, hint: "bv. RONDE 1" }
      - { name: track, label: Circuit, widget: string }
      - { name: date, label: Datum, widget: date, format: "YYYY-MM-DD" }
      - { name: time, label: Tijd (bv. 09:00 - 18:00), widget: string, required: false }
      - { name: address, label: Adres / locatie, widget: string, required: false }
      - name: country
        label: Land
        widget: select
        options:
          - { label: Spanje, value: es }
          - { label: België, value: be }
          - { label: Italië, value: it }
          - { label: Nederland, value: nl }
      - { name: result, label: Resultaat (bv. P1), widget: string, required: false }
      - { name: upcoming, label: Aankomende race?, widget: boolean, default: false }
      - { name: body, label: Notities, widget: text, required: false }

  - name: sponsors
    label: Sponsors
    label_singular: Sponsor
    folder: content/sponsors
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Naam, widget: string }
      - { name: logo, label: Logo, widget: image, required: false }
      - { name: url, label: Website URL, widget: string, required: false }
      - { name: order, label: Volgorde, widget: number, default: 0, value_type: int }

  - name: socials
    label: Socials (Instagram posts)
    label_singular: Post
    folder: content/socials
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{date}}-{{slug}}"
    summary: "{{caption}}"
    sortable_fields: [date, order]
    fields:
      - { name: image, label: Afbeelding, widget: image }
      - { name: caption, label: Caption / tekst, widget: text }
      - { name: link, label: Link naar Instagram post, widget: string, required: false }
      - { name: date, label: Datum, widget: date, format: "YYYY-MM-DD" }
      - { name: order, label: Volgorde (lager = eerst), widget: number, default: 0, value_type: int, required: false }
