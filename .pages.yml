# Pages CMS configuration — https://pagescms.org
# Edit content at https://app.pagescms.org after connecting this repo.

media:
  input: public/images/uploads
  output: /images/uploads

content:
  - name: about
    label: About
    type: file
    path: content/about.md
    fields:
      - { name: name, label: Name, type: string }
      - { name: subtitle, label: Section label, type: string }
      - { name: portrait, label: Portrait photo, type: image }
      - { name: action, label: Action photo, type: image }
      - { name: age, label: Age, type: string }
      - { name: class, label: Class, type: string }
      - { name: nationality, label: Nationality, type: string }
      - { name: team, label: Team, type: string }
      - { name: body, label: Bio, type: text }

  - name: races
    label: Race calendar
    type: collection
    path: content/races
    view:
      fields: [round, track, date, result]
      primary: track
      sort: [date]
    fields:
      - { name: round, label: Round, type: string }
      - { name: track, label: Track / Circuit, type: string }
      - { name: date, label: Date, type: date }
      - name: country
        label: Country
        type: select
        options:
          values: [es, be, it, nl]
      - { name: result, label: Result (e.g. P1), type: string, required: false }
      - { name: upcoming, label: Upcoming race?, type: boolean, default: false }
      - { name: body, label: Notes, type: text, required: false }

  - name: sponsors
    label: Sponsors
    type: collection
    path: content/sponsors
    view:
      fields: [name, order]
      primary: name
      sort: [order]
    fields:
      - { name: name, label: Name, type: string }
      - { name: logo, label: Logo, type: image, required: false }
      - { name: url, label: Website URL, type: string, required: false }
      - { name: order, label: Display order, type: number, default: 0 }
